name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (no external services)
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_audit_pipeline_full.py \
            --ignore=tests/test_audit_fixes.py \
            --ignore=tests/test_audit_fixes_batch3.py \
            --ignore=tests/test_blind_review_fixes.py

      - name: Run integration tests (requires DeepSeek)
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: |
          python -m pytest tests/test_audit_pipeline_full.py tests/test_audit_fixes.py tests/test_audit_fixes_batch3.py -v --tb=short
