# 初痕记忆引擎 + Ollama 一键启动
# 用法: docker compose up -d
# 首次: docker compose exec ollama ollama pull bge-m3 && docker compose exec ollama ollama pull qwen2.5:3b

services:
  ollama:
    image: ollama/ollama:latest
    container_name: firstbeat-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  firstbeat:
    build: .
    container_name: firstbeat-app
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - LOCAL_LLM_OLLAMA_URL=${LOCAL_LLM_OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-bge-m3}
      - OLLAMA_NUM_THREADS=${OLLAMA_NUM_THREADS:-4}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - LOCAL_LLM_ENABLED=${LOCAL_LLM_ENABLED:-true}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen2.5:3b}
      - DATA_DIR=${DATA_DIR:-/app/data}
    volumes:
      - firstbeat_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_models:
  firstbeat_data:
